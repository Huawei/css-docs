# Generated by Huawei CSI Config Wizard (backend: {{backend.name}} · protocol {{backend.protocol}})
# Create command: oceanctl create backend -f {{backend.name}}.yaml -i yaml
storage: "{{family.storage}}"
name: "{{backend.name}}"
namespace: "{{helm.namespace}}"
urls:
  - "{{backend.url}}"
pools:
{{#each backend.pools}}
  - "{{this}}"
{{/each}}
{{#if backend.protocol}}
parameters:
  protocol: "{{backend.protocol}}"
  {{#if backend.parentname}}
  parentname: "{{backend.parentname}}"
  {{/if}}
  {{#if backend.nfsAutoAuthClient}}
  nfsAutoAuthClient: "true"
  {{/if}}
  {{#if backend.nfsAutoAuthClientCIDRs}}
  nfsAutoAuthClientCIDRs:
  {{#each backend.nfsAutoAuthClientCIDRs}}
    - "{{this}}"
  {{/each}}
  {{/if}}
  {{#if backend.portals}}
  portals:
  {{#each backend.portals}}
    - "{{this}}"
  {{/each}}
  {{/if}}
  {{#if backend.scsiHosts}}
  portals:
  {{#each backend.scsiHosts}}
    - "{{this.key}}": "{{this.value}}"
  {{/each}}
  {{/if}}
  {{#if backend.alua}}
  ALUA: "true"
  {{/if}}
{{/if}}
{{#if backend.vstoreName}}
vstoreName: "{{backend.vstoreName}}"
{{/if}}
{{#if backend.accountName}}
accountName: "{{backend.accountName}}"
{{/if}}
{{#if backend.metrovStorePairID}}
metrovStorePairID: "{{backend.metrovStorePairID}}"
{{/if}}
{{#if backend.metroBackend}}
metroBackend: "{{backend.metroBackend}}"
{{/if}}
{{#if backend.supportedTopologies}}
supportedTopologies: {{backend.supportedTopologies}}
{{/if}}
{{#if backend.storageDeviceSN}}
storageDeviceSN: {{backend.storageDeviceSN}}
{{/if}}
{{#if backend.maxClientThreads}}
maxClientThreads: "{{backend.maxClientThreads}}"
{{/if}}
{{#if backend.authenticationMode}}
authenticationMode: "{{backend.authenticationMode}}"
{{/if}}
